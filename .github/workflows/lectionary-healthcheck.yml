name: Liturgical Lectionary & Health Check

on:
  # 1. Run automatically once a week (every Monday at 00:00 UTC / 09:00 JST)
  schedule:
    - cron: '0 0 * * 1'

  # 2. Run automatically whenever code is pushed to main
  push:
    branches: [ main ]

  # 3. Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run Liturgical Lectionary Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lectionary & Calendar Verification Suite
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
